[project]
name = "veronica"
version = "0.1.0"
description = "Voice assistant for Windows powered by coding-agent CLIs"
requires-python = ">=3.12"
dependencies = [
  "claude-agent-sdk>=0.1.0",
  "httpx>=0.27",
  "openwakeword>=0.6.0",
  "webrtcvad-wheels>=2.0.14",
  "sounddevice>=0.5.1",
  "soundfile>=0.12.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "faster-whisper>=1.1.0",
  "kokoro-onnx>=0.4.0",
  "pydantic-settings>=2.6",
  "websockets>=13",
  "Pillow>=10",
  "psutil>=5.9",
  "google-auth>=2.29",
  "google-auth-oauthlib>=1.2",
  "requests>=2.31",
  # Windows integration (UI, audio endpoints, input, screen, OCR).
  "pywebview>=5; sys_platform == 'win32'",
  "pystray>=0.19; sys_platform == 'win32'",
  "pywin32>=306; sys_platform == 'win32'",
  "comtypes>=1.4; sys_platform == 'win32'",
  "pycaw>=20240210; sys_platform == 'win32'",
  "pynput>=1.7.7; sys_platform == 'win32'",
  "mss>=9; sys_platform == 'win32'",
  "uiautomation>=2.0.20; sys_platform == 'win32'",
  "keyring>=25; sys_platform == 'win32'",
  "winrt-runtime>=2.3; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=2.3; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=2.3; sys_platform == 'win32'",
  "winrt-Windows.Globalization>=2.3; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging>=2.3; sys_platform == 'win32'",
  "winrt-Windows.Media.Control>=2.3; sys_platform == 'win32'",
  "winrt-Windows.Media.Ocr>=2.3; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams>=2.3; sys_platform == 'win32'",
  "winrt-Windows.UI.Notifications>=2.3; sys_platform == 'win32'",
  "winrt-Windows.Data.Xml.Dom>=2.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "playwright>=1.45", "pyinstaller>=6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: needs real audio devices, models, or Claude Code login"]
addopts = "-m 'not live'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# The app targets Windows; Linux is kept resolvable so the (hermetic) test
# suite can run in CI containers.
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.hatch.build.targets.wheel]
packages = ["veronica"]
